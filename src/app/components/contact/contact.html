<section id="contact" appScrollAnimation>
  <h2>Get in Touch</h2>
  <div class="contact-content">
    <div class="contact-info">
      <h3>Let's Connect</h3>
      <p>
        Ready to start your coaching journey? I'd love to hear from you and discuss how I can
        support your professional growth.
      </p>
      <div class="contact-details">
        <div class="detail-item">
          <strong>Email</strong>
          <a href="mailto:barbi@coaching.example.com">barbi@coaching.example.com</a>
        </div>
        <div class="detail-item">
          <strong>LinkedIn</strong>
          <a href="https://linkedin.com/in/barbara-simon-hr" target="_blank">Connect with me</a>
        </div>
      </div>
    </div>
    <div class="contact-form">
      <form>
        <div class="form-group">
          <input type="text" name="name" placeholder="Your Name" required />
        </div>
        <div class="form-group">
          <input type="email" name="email" placeholder="Your Email" required />
        </div>
        <div class="form-group">
          <textarea
            name="message"
            placeholder="Tell me about your situation..."
            rows="6"
            required
          ></textarea>
        </div>
        <button type="submit" class="button">Send Message</button>
      </form>
    </div>
  </div>
</section>
